<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f7f9" media="(prefers-color-scheme: light)">
<title>KrixGPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
/* ---------- Design tokens ---------- */
:root {
    --bg: #0f1117;
    --bg-elev: #161923;
    --bg-elev-2: #1d2130;
    --surface: #1a1e2a;
    --border: #2a2f3e;
    --border-strong: #3a4053;
    --text: #e8eaf0;
    --text-muted: #9aa0b4;
    --text-faint: #6b7186;
    --accent: #6c7cff;
    --accent-hover: #7f8dff;
    --accent-soft: rgba(108, 124, 255, 0.14);
    --user-bubble: #2a3150;
    --ai-avatar: #10b981;
    --danger: #ef5350;
    --danger-soft: rgba(239, 83, 80, 0.12);
    --warn: #f5b041;
    --warn-soft: rgba(245, 176, 65, 0.12);
    --success: #34d399;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    --radius: 14px;
    --radius-sm: 10px;
    --sidebar-w: 280px;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
}

:root[data-theme="light"] {
    --bg: #f7f7f9;
    --bg-elev: #ffffff;
    --bg-elev-2: #f0f1f5;
    --surface: #ffffff;
    --border: #e3e5ec;
    --border-strong: #cfd3df;
    --text: #15171f;
    --text-muted: #5b6075;
    --text-faint: #8a8fa3;
    --accent: #4f5fe6;
    --accent-hover: #3f4fd6;
    --accent-soft: rgba(79, 95, 230, 0.10);
    --user-bubble: #e8ebfa;
    --danger: #d32f2f;
    --danger-soft: rgba(211, 47, 47, 0.08);
    --warn: #c47c00;
    --warn-soft: rgba(196, 124, 0, 0.10);
    --shadow: 0 8px 30px rgba(20, 24, 40, 0.10);
}

@media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
        --bg: #f7f7f9;
        --bg-elev: #ffffff;
        --bg-elev-2: #f0f1f5;
        --surface: #ffffff;
        --border: #e3e5ec;
        --border-strong: #cfd3df;
        --text: #15171f;
        --text-muted: #5b6075;
        --text-faint: #8a8fa3;
        --accent: #4f5fe6;
        --accent-hover: #3f4fd6;
        --accent-soft: rgba(79, 95, 230, 0.10);
        --user-bubble: #e8ebfa;
        --danger: #d32f2f;
        --danger-soft: rgba(211, 47, 47, 0.08);
        --warn: #c47c00;
        --warn-soft: rgba(196, 124, 0, 0.10);
        --shadow: 0 8px 30px rgba(20, 24, 40, 0.10);
    }
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }

html, body {
    height: 100%;
    margin: 0;
}

body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
}

button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
}

button:focus-visible,
select:focus-visible,
textarea:focus-visible,
.history-item:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}

/* ---------- App shell ---------- */
.app {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    height: 100vh;
    height: 100dvh;
}

/* ---------- Sidebar ---------- */
.sidebar {
    display: flex;
    flex-direction: column;
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    padding: 16px 12px;
    padding-top: calc(16px + env(safe-area-inset-top));
    gap: 12px;
    min-height: 0;
}

.sidebar-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 8px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.01em;
}

.brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
}

.icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    color: var(--text-muted);
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
}

.icon-btn:hover {
    background: var(--bg-elev-2);
    color: var(--text);
}

.icon-btn svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.new-chat {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 11px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    transition: border-color 0.15s, background 0.15s;
}

.new-chat:hover {
    border-color: var(--border-strong);
    background: var(--bg-elev-2);
}

.new-chat svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
}

.history-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    padding: 8px 10px 2px;
}

.conversation-list {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-right: 2px;
}

.history-item {
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    color: var(--text-muted);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background 0.15s, color 0.15s;
}

.history-item:hover {
    background: var(--bg-elev-2);
    color: var(--text);
}

.history-item.active {
    background: var(--accent-soft);
    color: var(--text);
    font-weight: 500;
}

.history-item.empty {
    color: var(--text-faint);
    cursor: default;
    font-style: italic;
}

.sidebar-foot {
    border-top: 1px solid var(--border);
    padding-top: 10px;
}

.backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 40;
    opacity: 0;
    transition: opacity 0.2s;
}

/* ---------- Main ---------- */
.main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    position: relative;
}

.topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
}

.topbar .menu-btn { display: none; }

.topbar-title {
    font-weight: 600;
    font-size: 15px;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-muted);
    background: var(--bg-elev);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 999px;
    max-width: 50vw;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    flex-shrink: 0;
}

.status-pill.busy .status-dot {
    background: var(--accent);
    animation: pulse 1.1s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
}

/* ---------- Chat ---------- */
.chat-container {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 24px 16px 16px;
    scroll-behavior: smooth;
}

.chat-inner {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.welcome {
    text-align: center;
    padding: 8vh 8px 8px;
}

.welcome h1 {
    font-size: clamp(22px, 4vw, 30px);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
}

.welcome p {
    color: var(--text-muted);
    margin: 0;
    font-size: 15px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px;
}

.card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: left;
    padding: 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    transition: border-color 0.15s, transform 0.15s, background 0.15s;
}

.card:hover {
    border-color: var(--accent);
    background: var(--bg-elev-2);
    transform: translateY(-1px);
}

.card .card-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid;
    place-items: center;
}

.card .card-icon svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.card .card-sub {
    font-size: 12px;
    color: var(--text-faint);
}

.message {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    animation: fadeUp 0.2s ease-out;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: none; }
}

.message.user {
    flex-direction: row-reverse;
}

.avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
}

.user-avatar { background: var(--accent); }
.bot-avatar { background: var(--ai-avatar); }

.message-body {
    min-width: 0;
    max-width: min(85%, 680px);
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.message.user .message-body { align-items: flex-end; }

.message-content {
    font-size: 15px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.message.user .message-content {
    background: var(--user-bubble);
    padding: 11px 15px;
    border-radius: 18px 18px 4px 18px;
}

.message.assistant .message-content {
    padding-top: 4px;
}

.message.assistant .message-content.rendered {
    white-space: normal;
}

/* Markdown inside assistant replies */
.message-content.rendered > :first-child { margin-top: 0; }
.message-content.rendered > :last-child { margin-bottom: 0; }
.message-content.rendered p { margin: 0 0 10px; }
.message-content.rendered h1,
.message-content.rendered h2,
.message-content.rendered h3 { margin: 16px 0 8px; line-height: 1.3; }
.message-content.rendered h1 { font-size: 20px; }
.message-content.rendered h2 { font-size: 18px; }
.message-content.rendered h3 { font-size: 16px; }
.message-content.rendered ul,
.message-content.rendered ol { margin: 0 0 10px; padding-left: 22px; }
.message-content.rendered li { margin: 3px 0; }
.message-content.rendered a { color: var(--accent); }
.message-content.rendered blockquote {
    margin: 0 0 10px;
    padding: 4px 14px;
    border-left: 3px solid var(--border-strong);
    color: var(--text-muted);
}
.message-content.rendered code {
    font-family: var(--mono);
    font-size: 13px;
    background: var(--bg-elev-2);
    padding: 2px 6px;
    border-radius: 6px;
}
.message-content.rendered pre {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    overflow-x: auto;
    margin: 0 0 10px;
}
.message-content.rendered pre code {
    background: none;
    padding: 0;
    font-size: 13px;
}
.message-content.rendered table {
    border-collapse: collapse;
    margin: 0 0 10px;
    display: block;
    overflow-x: auto;
    max-width: 100%;
    font-size: 14px;
}
.message-content.rendered th,
.message-content.rendered td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
}
.message-content.rendered th { background: var(--bg-elev-2); }

.message-actions {
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.15s;
}

.message:hover .message-actions,
.message:focus-within .message-actions { opacity: 1; }

.action-btn {
    font-size: 12px;
    color: var(--text-faint);
    padding: 3px 8px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

.action-btn:hover { background: var(--bg-elev-2); color: var(--text); }

.action-btn svg {
    width: 13px;
    height: 13px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.typing {
    display: inline-flex;
    gap: 4px;
    padding: 6px 0;
}

.typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-faint);
    animation: bounce 1.2s infinite;
}

.typing span:nth-child(2) { animation-delay: 0.15s; }
.typing span:nth-child(3) { animation-delay: 0.3s; }

@keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-5px); opacity: 1; }
}

/* Tool progress chip */
.tool-progress {
    display: flex;
    padding-left: 44px;
}

.message.user + .tool-progress { margin-top: -8px; }

.tool-progress-box {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-muted);
    background: var(--bg-elev);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 999px;
}

.tool-spinner {
    width: 13px;
    height: 13px;
    border: 2px solid var(--border-strong);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.tool-check {
    color: var(--success);
    font-weight: 700;
    font-size: 13px;
}

/* Error card */
.error-card {
    border: 1px solid var(--danger);
    background: var(--danger-soft);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 14px;
    white-space: normal;
}

.error-card.warn {
    border-color: var(--warn);
    background: var(--warn-soft);
}

.error-card strong {
    display: block;
    margin-bottom: 4px;
}

.error-card details {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-muted);
}

.error-card summary { cursor: pointer; }

.error-card pre {
    font-family: var(--mono);
    font-size: 11px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    margin: 6px 0 0;
    max-height: 160px;
    overflow: auto;
}

/* ---------- Composer ---------- */
.input-area {
    flex-shrink: 0;
    padding: 8px 16px 12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
}

.input-wrapper {
    max-width: 820px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 8px 8px 6px 14px;
    transition: border-color 0.15s;
}

.input-wrapper:focus-within { border-color: var(--accent); }

.input-wrapper textarea {
    width: 100%;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    max-height: 200px;
    padding: 6px 4px;
    display: block;
}

.input-wrapper textarea::placeholder { color: var(--text-faint); }

.composer-bar {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 2px;
}

.composer-bar .spacer { flex: 1; }

.model-select-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
}

.model-select {
    appearance: none;
    -webkit-appearance: none;
    background: var(--bg-elev-2);
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 26px 6px 12px;
    cursor: pointer;
    max-width: 44vw;
    text-overflow: ellipsis;
}

.model-select:hover { color: var(--text); border-color: var(--border-strong); }

.model-select-wrap::after {
    content: "";
    position: absolute;
    right: 11px;
    width: 6px;
    height: 6px;
    border-right: 1.5px solid var(--text-muted);
    border-bottom: 1.5px solid var(--text-muted);
    transform: translateY(-1px) rotate(45deg);
    pointer-events: none;
}

.mic-btn.recording {
    color: var(--danger);
    background: var(--danger-soft);
    animation: pulse 1.2s ease-in-out infinite;
}

.send-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: grid;
    place-items: center;
    transition: background 0.15s, transform 0.1s;
}

.send-btn:hover:not(:disabled) { background: var(--accent-hover); }
.send-btn:active:not(:disabled) { transform: scale(0.95); }
.send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

.send-btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.notice {
    max-width: 820px;
    margin: 8px auto 0;
    text-align: center;
    font-size: 11.5px;
    color: var(--text-faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* ---------- Auth ---------- */
.auth-overlay {
    position: fixed;
    inset: 0;
    z-index: 70;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--bg);
}

.auth-overlay.show { display: flex; }

.auth-card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 36px 28px 28px;
    text-align: center;
}

.auth-card .brand {
    justify-content: center;
    font-size: 22px;
    margin-bottom: 18px;
}

.auth-card .brand-mark { width: 40px; height: 40px; font-size: 18px; border-radius: 12px; }

.auth-card h2 {
    font-size: 20px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
}

.auth-card p {
    color: var(--text-muted);
    font-size: 14px;
    margin: 0 0 24px;
}

.google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid var(--border-strong);
    background: var(--bg-elev);
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
    transition: background 0.15s, border-color 0.15s;
}

.google-btn:hover:not(:disabled) { background: var(--bg-elev-2); border-color: var(--accent); }
.google-btn:disabled { opacity: 0.6; cursor: wait; }
.google-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

.auth-error {
    margin-top: 14px;
    font-size: 13px;
    color: var(--danger);
    min-height: 18px;
}

.auth-foot {
    margin-top: 18px;
    font-size: 12px;
    color: var(--text-faint);
}

.user-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 6px 6px 8px;
    border-radius: var(--radius-sm);
}

.user-chip img,
.user-chip .user-initial {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--accent);
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 600;
    font-size: 13px;
    object-fit: cover;
}

.user-meta {
    flex: 1;
    min-width: 0;
    line-height: 1.25;
}

.user-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.user-email {
    font-size: 11px;
    color: var(--text-faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.signin-btn {
    margin-top: 8px;
    justify-content: center;
    border-color: var(--accent);
    color: var(--accent);
}

.signin-btn:hover { background: var(--accent-soft); }

.signin-btn svg { width: 16px; height: 16px; }

.top-signin {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
}

.top-signin:hover { background: var(--accent-soft); }

.top-signin svg { width: 14px; height: 14px; }

.guest .top-signin { display: inline-flex; }
.guest #logoutBtn { display: none; }
.guest #signInBtn { display: flex; }
#signInBtn { display: none; }

.auth-close {
    position: absolute;
    top: 10px;
    right: 10px;
}

.auth-card { position: relative; }

.auth-guest-link {
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: underline;
    text-underline-offset: 3px;
}

.auth-guest-link:hover { color: var(--text); }

@media (max-width: 480px) {
    .top-signin span { display: none; }
    .top-signin { padding: 7px 9px; }
}

/* ---------- Toast ---------- */
.toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background: var(--bg-elev-2);
    color: var(--text);
    border: 1px solid var(--border-strong);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 13px;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 60;
    max-width: calc(100vw - 32px);
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }

    .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: min(var(--sidebar-w), 84vw);
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.22s ease;
        box-shadow: none;
    }

    .sidebar.open {
        transform: translateX(0);
        box-shadow: var(--shadow);
    }

    .backdrop.show {
        display: block;
        opacity: 1;
    }

    .topbar .menu-btn { display: grid; }

    .chat-container { padding: 16px 12px 12px; }

    .message-body { max-width: 92%; }

    .tool-progress { padding-left: 0; }

    .input-area { padding: 6px 10px 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }

    .input-wrapper { border-radius: 18px; padding-left: 12px; }

    .welcome { padding-top: 5vh; }

    .cards { grid-template-columns: 1fr 1fr; }

    .status-pill { max-width: 40vw; }
}

@media (max-width: 480px) {
    .cards { grid-template-columns: 1fr; }

    .card .card-sub { display: none; }

    .message-content { font-size: 14.5px; }

    .avatar { width: 28px; height: 28px; font-size: 11px; }

    .topbar-title { font-size: 14px; }

    .status-pill .status-label { display: none; }
    .status-pill { padding: 6px; }
    .status-pill.busy .status-label { display: inline; }

    .model-select { max-width: 38vw; }

    .notice { display: none; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
    .chat-container { scroll-behavior: auto; }
}
</style>
</head>

<body>
<div class="app">
    <div class="backdrop" id="backdrop" onclick="closeSidebar()"></div>

    <aside class="sidebar" id="sidebar" aria-label="Conversations">
        <div class="sidebar-head">
            <div class="brand">
                <span class="brand-mark">K</span>
                <span>KrixGPT</span>
            </div>
            <button class="icon-btn" onclick="closeSidebar()" aria-label="Close menu" id="closeSidebarBtn">
                <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>

        <button class="new-chat" onclick="newChat()">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            New chat
        </button>

        <div class="history-title">Recent chats</div>
        <div class="conversation-list" id="conversationList" role="list"></div>

        <div class="sidebar-foot">
            <div class="user-chip" id="userChip">
                <span class="user-initial" id="userAvatar">?</span>
                <div class="user-meta">
                    <div class="user-name" id="userName">Not signed in</div>
                    <div class="user-email" id="userEmail"></div>
                </div>
                <button class="icon-btn" onclick="logout()" title="Sign out" aria-label="Sign out" id="logoutBtn">
                    <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                </button>
            </div>
            <button class="new-chat signin-btn" id="signInBtn" onclick="showLogin()">
                <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
                Sign in to save chats
            </button>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <button class="icon-btn menu-btn" onclick="openSidebar()" aria-label="Open menu">
                <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
            <div class="topbar-title" id="topbarTitle">Agentic AI Chatbot</div>
            <div class="status-pill" id="statusPill">
                <span class="status-dot"></span>
                <span class="status-label" id="status">Ready</span>
            </div>
            <button class="top-signin" onclick="showLogin()" id="topSignIn">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                <span>Sign in</span>
            </button>
            <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">
                <svg viewBox="0 0 24 24" id="themeIcon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
        </header>

        <div class="chat-container" id="chatScroll">
            <div class="chat-inner" id="chatContainer"></div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <label for="messageInput" class="sr-only">Message</label>
                <textarea
                    id="messageInput"
                    placeholder="Ask anything..."
                    rows="1"
                    oninput="autoResize(this)"
                    onkeydown="handleKeyDown(event)"
                    autocomplete="off"
                ></textarea>

                <div class="composer-bar">
                    <input
                        type="file"
                        id="fileInput"
                        class="sr-only"
                        accept=".pdf,.docx,.txt,.md,.py,.csv"
                        onchange="uploadFile()"
                        tabindex="-1"
                    >
                    <button class="icon-btn attach-btn" onclick="openFilePicker()" title="Upload document" aria-label="Upload document">
                        <svg viewBox="0 0 24 24"><path d="m21.4 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.2-9.19a4 4 0 0 1 5.65 5.66l-9.2 9.19a2 2 0 0 1-2.82-2.83l8.48-8.48"/></svg>
                    </button>

                    <div class="model-select-wrap">
                        <select id="modelSelect" class="model-select" title="Select model" aria-label="Select model" data-default="{{ default_model }}">
                            {% for group in model_groups %}
                            <optgroup label="{{ group.label }}">
                                {% for m in group.models %}
                                <option value="{{ m.id }}"{% if m.id == default_model %} selected{% endif %}>{{ m.label }}</option>
                                {% endfor %}
                            </optgroup>
                            {% endfor %}
                            {% if not model_groups %}
                            <option value="">No model configured</option>
                            {% endif %}
                        </select>
                    </div>

                    <span class="spacer"></span>

                    <button class="icon-btn mic-btn" id="micBtn" onclick="toggleDictation()" title="Dictate" aria-label="Dictate">
                        <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg>
                    </button>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send message">
                        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                    </button>
                </div>
            </div>
            <div class="notice" id="noticeText">KrixGPT can make mistakes. Check important info.</div>
        </div>
    </main>
</div>

<div class="auth-overlay" id="authOverlay" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="auth-card">
        <button class="icon-btn auth-close" onclick="hideLogin()" aria-label="Close">
            <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <div class="brand">
            <span class="brand-mark">K</span>
            <span>KrixGPT</span>
        </div>
        <h2 id="authTitle">Sign in to KrixGPT</h2>
        <p>Keep your chats, documents and memory across devices. Chats you started as a guest in this browser come with you.</p>
        <button class="google-btn" id="googleBtn" onclick="signInWithGoogle()">
            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#FBBC04" d="M6.4 14a6 6 0 0 1 0-3.9V7.5H3.1a10 10 0 0 0 0 9z"/><path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.5l3.3 2.6C7.2 7.8 9.4 6 12 6z"/></svg>
            Continue with Google
        </button>
        <div class="auth-error" id="authError" aria-live="polite"></div>
        <button class="auth-guest-link" onclick="hideLogin()">Continue as guest</button>
        <div class="auth-foot">Powered by Firebase Authentication</div>
    </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="application/json" id="serverState">{"firebase": {{ firebase_config | safe }}, "user": {{ current_user | tojson }}}</script>

<script>
/* ---------- Server-provided state (rendered by Jinja into #serverState) ---------- */
const SERVER_STATE = (() => {
    try { return JSON.parse(document.getElementById("serverState").textContent); }
    catch (e) { console.error("Bad server state:", e); return { firebase: {}, user: null }; }
})();
const FIREBASE_CONFIG = SERVER_STATE.firebase || {};
let currentUser = SERVER_STATE.user || null;

/* ---------- Element refs ---------- */
const chatContainer = document.getElementById("chatContainer");
const chatScroll = document.getElementById("chatScroll");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const statusText = document.getElementById("status");
const statusPill = document.getElementById("statusPill");
const conversationList = document.getElementById("conversationList");
const modelSelect = document.getElementById("modelSelect");
const noticeText = document.getElementById("noticeText");
const micBtn = document.getElementById("micBtn");
const sidebar = document.getElementById("sidebar");
const backdrop = document.getElementById("backdrop");
const toastEl = document.getElementById("toast");
const topbarTitle = document.getElementById("topbarTitle");

const DEFAULT_NOTICE = "KrixGPT can make mistakes. Check important info.";
const DEFAULT_MODEL = modelSelect.dataset.default || (modelSelect.options[0] ? modelSelect.options[0].value : "");

const authOverlay = document.getElementById("authOverlay");
const authError = document.getElementById("authError");
const googleBtn = document.getElementById("googleBtn");

/* ---------- Auth ---------- */
let firebaseReady = false;
try {
    if (window.firebase && FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey) {
        firebase.initializeApp(FIREBASE_CONFIG);
        firebaseReady = true;
    }
} catch (e) {
    console.error("Firebase init failed:", e);
}

function showLogin(message = "", expired = false) {
    if (expired) {
        currentUser = null;
        renderUserChip();
    }
    authError.textContent = message;
    authOverlay.classList.add("show");
    document.querySelector(".app").setAttribute("aria-hidden", "true");
    if (isMobile()) closeSidebar();
}

function hideLogin() {
    authOverlay.classList.remove("show");
    document.querySelector(".app").removeAttribute("aria-hidden");
}

function renderUserChip() {
    let avatar = document.getElementById("userAvatar");
    const name = document.getElementById("userName");
    const email = document.getElementById("userEmail");
    const logoutBtn = document.getElementById("logoutBtn");

    document.body.classList.toggle("guest", !currentUser);

    if (!currentUser) {
        if (avatar.tagName === "IMG") {
            const span = document.createElement("span");
            span.className = "user-initial";
            span.id = "userAvatar";
            avatar.replaceWith(span);
            avatar = span;
        }
        avatar.textContent = "G";
        name.textContent = "Guest";
        email.textContent = "Chats stay in this browser only";
        logoutBtn.style.display = "none";
        return;
    }

    const display = currentUser.name || currentUser.email || "User";
    name.textContent = display;
    email.textContent = currentUser.email || "";
    logoutBtn.style.display = "";

    if (currentUser.picture) {
        const img = document.createElement("img");
        img.src = currentUser.picture;
        img.alt = "";
        img.referrerPolicy = "no-referrer";
        img.id = "userAvatar";
        avatar.replaceWith(img);
    } else {
        avatar.textContent = display.trim().charAt(0).toUpperCase();
    }
}

async function finishLogin(idToken) {
    const guestThreadIds = guestThreads();
    const response = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idToken, guestThreadIds })
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
        throw new Error(data.detail || data.error || "Login failed.");
    }
    const carryThread = threadId;
    currentUser = data.user;
    if (carryThread) safeSet(threadKey(), carryThread);
    threadId = resolveThreadId();
    safeSet("guest_threads", "[]");
    renderUserChip();
    hideLogin();
    showToast(`Signed in as ${currentUser.name || currentUser.email}`);
    await bootstrapChat();
}

async function signInWithGoogle() {
    if (!firebaseReady) {
        authError.textContent = "Sign-in is not configured on this server.";
        return;
    }
    authError.textContent = "";
    googleBtn.disabled = true;

    try {
        const provider = new firebase.auth.GoogleAuthProvider();
        let result;
        try {
            result = await firebase.auth().signInWithPopup(provider);
        } catch (popupError) {
            const blocked = ["auth/popup-blocked", "auth/operation-not-supported-in-this-environment"];
            if (blocked.includes(popupError.code)) {
                await firebase.auth().signInWithRedirect(provider);
                return;
            }
            throw popupError;
        }
        const idToken = await result.user.getIdToken();
        await finishLogin(idToken);
    } catch (error) {
        console.error("Sign-in failed:", error);
        if (error.code === "auth/popup-closed-by-user" || error.code === "auth/cancelled-popup-request") {
            authError.textContent = "";
        } else {
            authError.textContent = error.message || "Sign-in failed. Please try again.";
        }
    } finally {
        googleBtn.disabled = false;
    }
}

async function handleRedirectResult() {
    if (!firebaseReady) return;
    try {
        const result = await firebase.auth().getRedirectResult();
        if (result && result.user) {
            const idToken = await result.user.getIdToken();
            await finishLogin(idToken);
        }
    } catch (error) {
        console.error("Redirect sign-in failed:", error);
        authError.textContent = error.message || "Sign-in failed. Please try again.";
    }
}

async function logout() {
    try { await fetch("/auth/logout", { method: "POST" }); } catch (e) { /* ignore */ }
    if (firebaseReady) {
        try { await firebase.auth().signOut(); } catch (e) { /* ignore */ }
    }
    if (isDictating) stopDictation();
    currentUser = null;
    threadId = crypto.randomUUID();
    safeSet(threadKey(), threadId);
    renderUserChip();
    closeSidebar();
    renderWelcome();
    await loadConversations();
    showToast("Signed out. You're browsing as a guest.");
}

/* fetch wrapper: any 401 sends the user back to the login screen */
async function api(url, options) {
    const response = await fetch(url, options);
    if (response.status === 401) {
        showLogin("Your session has expired. Please sign in again.", true);
        throw new Error("Not authenticated.");
    }
    return response;
}

/* ---------- Thread + model persistence ---------- */
/* Thread ids are stored per signed-in account so two users sharing a
   browser never land in each other's conversation. */
function threadKey() {
    return currentUser && currentUser.uid ? `thread_id_${currentUser.uid}` : "thread_id";
}

function resolveThreadId() {
    let id = safeGet(threadKey());
    if (!id) {
        id = crypto.randomUUID();
        safeSet(threadKey(), id);
    }
    return id;
}

/* Guests have no server-side account, so the browser remembers which
   threads it created and asks the server for exactly those. */
function guestThreads() {
    try {
        const list = JSON.parse(safeGet("guest_threads") || "[]");
        return Array.isArray(list) ? list : [];
    } catch (e) {
        return [];
    }
}

function rememberGuestThread(id) {
    if (currentUser || !id) return;
    const list = guestThreads().filter(x => x !== id);
    list.unshift(id);
    safeSet("guest_threads", JSON.stringify(list.slice(0, 50)));
}

let threadId = resolveThreadId();

const savedModel = safeGet("selected_model");
const modelValues = Array.from(modelSelect.options).map(o => o.value);
if (savedModel && modelValues.includes(savedModel)) {
    modelSelect.value = savedModel;
} else {
    modelSelect.value = DEFAULT_MODEL;
    safeSet("selected_model", DEFAULT_MODEL);
}

function modelLabel(value) {
    const opt = Array.from(modelSelect.options).find(o => o.value === value);
    return opt ? opt.textContent.trim() : value;
}

modelSelect.addEventListener("change", () => {
    safeSet("selected_model", modelSelect.value);
    showToast(`Model set to ${modelLabel(modelSelect.value)}`);
});

function safeGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
}

function safeSet(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* storage unavailable */ }
}

/* ---------- Theme ---------- */
(function initTheme() {
    const saved = safeGet("theme");
    if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
    }
})();

function toggleTheme() {
    const root = document.documentElement;
    const current = root.getAttribute("data-theme")
        || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    const next = current === "light" ? "dark" : "light";
    root.setAttribute("data-theme", next);
    safeSet("theme", next);
}

/* ---------- Sidebar (mobile drawer) ---------- */
function openSidebar() {
    sidebar.classList.add("open");
    backdrop.classList.add("show");
    sidebar.setAttribute("aria-modal", "true");
}

function closeSidebar() {
    sidebar.classList.remove("open");
    backdrop.classList.remove("show");
    sidebar.removeAttribute("aria-modal");
}

function isMobile() {
    return window.matchMedia("(max-width: 900px)").matches;
}

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && sidebar.classList.contains("open")) closeSidebar();
});

/* ---------- Status helpers ---------- */
function setStatus(text, busy = false) {
    statusText.textContent = text;
    statusPill.classList.toggle("busy", busy);
}

let toastTimer = null;
function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

function scrollToBottom() {
    chatScroll.scrollTop = chatScroll.scrollHeight;
}

/* ---------- Markdown ---------- */
function renderMarkdown(target, text) {
    if (window.marked && window.DOMPurify) {
        try {
            const html = marked.parse(text, { breaks: true, gfm: true });
            target.innerHTML = DOMPurify.sanitize(html, { ADD_ATTR: ["target"] });
            target.querySelectorAll("a").forEach(a => {
                a.setAttribute("target", "_blank");
                a.setAttribute("rel", "noopener noreferrer");
            });
            target.classList.add("rendered");
            return;
        } catch (e) {
            console.error("Markdown render failed:", e);
        }
    }
    target.classList.remove("rendered");
    target.textContent = text;
}

/* ---------- Friendly error mapping ---------- */
function describeError(raw, model) {
    const text = String(raw || "");
    if (/429|RESOURCE_EXHAUSTED|quota/i.test(text)) {
        return {
            level: "warn",
            title: "Daily quota reached",
            body: `The free tier for ${model} is used up for today. Pick a different model from the selector below, or try again later.`
        };
    }
    if (/503|UNAVAILABLE|high demand/i.test(text)) {
        return {
            level: "warn",
            title: "Model is busy",
            body: "The model is under heavy load right now. Please try again in a moment."
        };
    }
    if (/404|NOT_FOUND|no longer available/i.test(text)) {
        return {
            level: "error",
            title: "Model not available",
            body: `${model} isn't available for this API key. Choose another model from the selector.`
        };
    }
    if (/Error code: 400|401|403|API key|PERMISSION_DENIED|invalid_api_key/i.test(text)) {
        return {
            level: "error",
            title: "Provider rejected the request",
            body: `The provider for ${model} refused the request, usually because its API key is missing or invalid. Pick another model from the selector, or fix the key on the server.`
        };
    }
    return {
        level: "error",
        title: "Something went wrong",
        body: "The request could not be completed. Please try again."
    };
}

function renderErrorCard(target, raw, model) {
    const info = describeError(raw, model);
    target.classList.remove("rendered");
    target.innerHTML = "";

    const card = document.createElement("div");
    card.className = "error-card" + (info.level === "warn" ? " warn" : "");

    const title = document.createElement("strong");
    title.textContent = info.title;

    const body = document.createElement("span");
    body.textContent = info.body;

    const details = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = "Technical details";
    const pre = document.createElement("pre");
    pre.textContent = String(raw || "");
    details.appendChild(summary);
    details.appendChild(pre);

    card.appendChild(title);
    card.appendChild(body);
    card.appendChild(details);
    target.appendChild(card);
}

/* ---------- Speech recognition ---------- */
let recognition = null;
let isDictating = false;

function setupSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return null;

    const sr = new SpeechRecognition();
    sr.lang = "en-US";
    sr.continuous = true;
    sr.interimResults = true;

    sr.onstart = () => {
        isDictating = true;
        micBtn.classList.add("recording");
        setStatus("Listening...", true);
    };

    sr.onresult = (event) => {
        let finalTranscript = "";
        let interimTranscript = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) finalTranscript += transcript + " ";
            else interimTranscript += transcript;
        }
        if (finalTranscript) {
            const current = messageInput.value.trim();
            messageInput.value = current ? current + " " + finalTranscript.trim() : finalTranscript.trim();
            autoResize(messageInput);
        }
        if (interimTranscript) noticeText.textContent = "Listening: " + interimTranscript;
    };

    sr.onerror = (event) => {
        console.error("Speech recognition error:", event.error);
        if (event.error === "not-allowed") showToast("Microphone permission denied.");
        stopDictation();
    };

    sr.onend = () => {
        if (isDictating) {
            try { sr.start(); } catch (e) { stopDictation(); }
        }
    };

    return sr;
}

function toggleDictation() {
    if (!recognition) recognition = setupSpeechRecognition();
    if (!recognition) {
        showToast("Speech input needs Chrome or Edge.");
        return;
    }
    if (isDictating) stopDictation();
    else startDictation();
}

function startDictation() {
    try { recognition.start(); } catch (e) { console.error("Could not start dictation:", e); }
}

function stopDictation() {
    isDictating = false;
    if (recognition) {
        try { recognition.stop(); } catch (e) { console.error("Could not stop dictation:", e); }
    }
    micBtn.classList.remove("recording");
    setStatus("Ready", false);
    noticeText.textContent = DEFAULT_NOTICE;
    messageInput.focus();
}

/* ---------- Composer helpers ---------- */
function autoResize(textarea) {
    textarea.style.height = "auto";
    textarea.style.height = Math.min(textarea.scrollHeight, 200) + "px";
}

function handleKeyDown(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
}

function usePrompt(text) {
    messageInput.value = text;
    autoResize(messageInput);
    messageInput.focus();
}

/* ---------- Messages ---------- */
function addMessage(role, content = "", options = {}) {
    hideWelcome();

    const messageDiv = document.createElement("div");
    messageDiv.className = role === "user" ? "message user" : "message assistant";

    const avatar = document.createElement("div");
    avatar.className = role === "user" ? "avatar user-avatar" : "avatar bot-avatar";
    avatar.textContent = role === "user" ? "U" : "AI";

    const body = document.createElement("div");
    body.className = "message-body";

    const messageContent = document.createElement("div");
    messageContent.className = "message-content";

    if (role === "assistant" && content) {
        renderMarkdown(messageContent, content);
    } else if (role === "assistant" && options.typing) {
        messageContent.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    } else {
        messageContent.textContent = content;
    }

    body.appendChild(messageContent);

    if (role === "assistant") {
        const actions = document.createElement("div");
        actions.className = "message-actions";
        const copyBtn = document.createElement("button");
        copyBtn.className = "action-btn";
        copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy';
        copyBtn.onclick = () => copyText(messageContent.dataset.raw || messageContent.textContent);
        actions.appendChild(copyBtn);
        body.appendChild(actions);
        messageContent.dataset.raw = content;
    }

    messageDiv.appendChild(avatar);
    messageDiv.appendChild(body);
    chatContainer.appendChild(messageDiv);
    scrollToBottom();

    return messageContent;
}

async function copyText(text) {
    try {
        await navigator.clipboard.writeText(text);
        showToast("Copied to clipboard");
    } catch (e) {
        showToast("Copy failed");
    }
}

function detectLikelyTool(message) {
    const text = message.toLowerCase();
    const mathPattern = /(\d+\s*[\+\-\*\/]\s*\d+)|calculate|calculation|math|solve/;
    const ragPattern = /document|pdf|file|uploaded|summarize|summary|according to|based on/;
    const memorySavePattern = /remember that|save this|store this|keep in memory|memorize/;
    const memoryRecallPattern = /what do you remember|recall|my memory|remember about me/;
    const webSearchPattern = /latest|current|today|now|recent|news|search web|web search|internet|online|price|version|update|2025|2026|who is|what is happening|trending|release|new model|current ceo|latest version/;

    if (memorySavePattern.test(text)) return "Memory Save";
    if (memoryRecallPattern.test(text)) return "Memory Recall";
    if (ragPattern.test(text)) return "Document Search";
    if (webSearchPattern.test(text)) return "Web Search";
    if (mathPattern.test(text)) return "Calculator";
    return null;
}

function addToolProgress(toolName) {
    const wrapper = document.createElement("div");
    wrapper.className = "tool-progress";

    const box = document.createElement("div");
    box.className = "tool-progress-box";

    const icon = document.createElement("span");
    icon.className = "tool-spinner";

    const text = document.createElement("span");
    text.textContent = `Using ${toolName}...`;

    box.appendChild(icon);
    box.appendChild(text);
    wrapper.appendChild(box);
    chatContainer.appendChild(wrapper);
    scrollToBottom();

    return { wrapper, icon, text };
}

function completeToolProgress(toolProgress, toolName) {
    if (!toolProgress) return;
    toolProgress.icon.className = "tool-check";
    toolProgress.icon.textContent = "✓";
    toolProgress.text.textContent = `${toolName} completed`;
}

/* ---------- Conversations ---------- */
async function loadConversations() {
    try {
        const url = currentUser
            ? "/conversations"
            : "/conversations?thread_ids=" + encodeURIComponent(guestThreads().join(","));
        const response = await api(url);
        const data = await response.json();
        conversationList.innerHTML = "";

        if (!data.conversations || data.conversations.length === 0) {
            const empty = document.createElement("div");
            empty.className = "history-item empty";
            empty.textContent = "No chats yet";
            conversationList.appendChild(empty);
            return;
        }

        data.conversations.forEach(conv => {
            const item = document.createElement("div");
            item.className = "history-item";
            item.setAttribute("role", "listitem");
            item.tabIndex = 0;
            if (conv.thread_id === threadId) {
                item.classList.add("active");
                topbarTitle.textContent = conv.title || "New chat";
                document.title = `${conv.title || "New chat"} · KrixGPT`;
            }
            item.textContent = conv.title || "New chat";
            item.title = conv.title || "New chat";
            item.onclick = () => loadConversation(conv.thread_id);
            item.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); loadConversation(conv.thread_id); } };
            conversationList.appendChild(item);
        });
    } catch (error) {
        console.error("Failed to load conversations:", error);
    }
}

async function loadConversation(selectedThreadId) {
    threadId = selectedThreadId;
    safeSet(threadKey(), threadId);
    if (isMobile()) closeSidebar();

    try {
        const response = await api(`/history/${threadId}`);
        const data = await response.json();
        chatContainer.innerHTML = "";

        if (!data.messages || data.messages.length === 0) {
            renderWelcome();
            await loadConversations();
            return;
        }

        data.messages.forEach(msg => {
            addMessage(msg.role === "user" ? "user" : "assistant", msg.content);
        });

        await loadConversations();
        scrollToBottom();
    } catch (error) {
        console.error("Failed to load conversation:", error);
    }
}

/* ---------- Streaming ---------- */
function parseSSEPart(part) {
    const lines = part.split(/\r?\n/).filter(line => line.trim().startsWith("data:"));
    if (lines.length === 0) return null;

    const jsonText = lines.map(line => line.replace(/^data:\s*/, "")).join("\n").trim();
    if (!jsonText || jsonText === "[DONE]") return null;

    try {
        return JSON.parse(jsonText);
    } catch (error) {
        console.error("Invalid stream JSON:", jsonText, error);
        return null;
    }
}

async function sendMessage() {
    const message = messageInput.value.trim();
    if (!message || sendBtn.disabled) return;
    if (isDictating) stopDictation();

    const selectedModel = modelSelect.value || DEFAULT_MODEL;

    addMessage("user", message);
    rememberGuestThread(threadId);
    messageInput.value = "";
    messageInput.style.height = "auto";
    sendBtn.disabled = true;
    setStatus(`Thinking with ${modelLabel(selectedModel)}`, true);

    const likelyTool = detectLikelyTool(message);
    let toolProgress = null;
    if (likelyTool) {
        toolProgress = addToolProgress(likelyTool);
        setStatus(`Using ${likelyTool}`, true);
    }

    const botElement = addMessage("assistant", "", { typing: true });
    let accumulated = "";
    let firstTokenReceived = false;
    let hadError = false;

    function handleStreamData(data) {
        if (!data) return;

        if (data.token !== undefined && data.token !== null) {
            if (!firstTokenReceived) {
                firstTokenReceived = true;
                botElement.innerHTML = "";
                if (likelyTool && toolProgress) completeToolProgress(toolProgress, likelyTool);
                setStatus(`Generating with ${modelLabel(selectedModel)}`, true);
            }
            accumulated += data.token;
            botElement.textContent = accumulated;
            botElement.dataset.raw = accumulated;
            scrollToBottom();
        }

        if (data.title) {
            topbarTitle.textContent = data.title;
            document.title = `${data.title} · KrixGPT`;
        }

        if (data.error) {
            hadError = true;
            if (likelyTool && toolProgress) completeToolProgress(toolProgress, likelyTool);
            if (accumulated) {
                renderMarkdown(botElement, accumulated);
                const extra = document.createElement("div");
                extra.style.marginTop = "10px";
                renderErrorCard(extra, data.error, selectedModel);
                botElement.appendChild(extra.firstChild);
            } else {
                renderErrorCard(botElement, data.error, selectedModel);
            }
            scrollToBottom();
        }

        if (data.done) {
            if (likelyTool && toolProgress && !firstTokenReceived) completeToolProgress(toolProgress, likelyTool);
            if (!hadError) {
                if (accumulated) renderMarkdown(botElement, accumulated);
                else botElement.textContent = "No response was generated.";
            }
            botElement.dataset.raw = accumulated;
        }
    }

    try {
        const response = await api("/chat/stream", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message, thread_id: threadId, model: selectedModel })
        });

        if (!response.ok) {
            let errorText = "Request failed.";
            try {
                const errorData = await response.json();
                errorText = errorData.detail || errorData.message || errorData.error || errorText;
            } catch (e) { /* non-JSON error */ }
            renderErrorCard(botElement, errorText, selectedModel);
            return;
        }

        if (!response.body) {
            botElement.textContent = "Streaming is not supported by this browser.";
            return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const parts = buffer.split(/\r?\n\r?\n/);
            buffer = parts.pop() || "";
            for (const part of parts) handleStreamData(parseSSEPart(part));
        }

        buffer += decoder.decode();
        if (buffer.trim()) handleStreamData(parseSSEPart(buffer));

        if (!firstTokenReceived && !hadError) {
            if (accumulated) renderMarkdown(botElement, accumulated);
            else botElement.textContent = "No response was generated.";
        }
    } catch (error) {
        console.error("Streaming error:", error);
        if (likelyTool && toolProgress) completeToolProgress(toolProgress, likelyTool);
        renderErrorCard(botElement, error.message, selectedModel);
    } finally {
        sendBtn.disabled = false;
        setStatus("Ready", false);
        messageInput.focus();
        await loadConversations();
    }
}

/* ---------- Upload ---------- */
async function uploadFile() {
    const fileInput = document.getElementById("fileInput");
    if (!fileInput.files.length) return;

    const file = fileInput.files[0];
    rememberGuestThread(threadId);
    addMessage("user", `📎 Uploaded document: ${file.name}`);
    const toolProgress = addToolProgress("Document Ingestion");
    setStatus("Ingesting document", true);

    const formData = new FormData();
    formData.append("file", file);
    formData.append("thread_id", threadId);

    try {
        const response = await api("/upload", { method: "POST", body: formData });
        const data = await response.json();
        completeToolProgress(toolProgress, "Document Ingestion");

        if (data.success) {
            addMessage("assistant", data.message + "\n\nYou can now ask questions about this document.");
            await loadConversations();
        } else {
            const el = addMessage("assistant", "");
            renderErrorCard(el, data.message, modelSelect.value);
        }
    } catch (error) {
        completeToolProgress(toolProgress, "Document Ingestion");
        const el = addMessage("assistant", "");
        renderErrorCard(el, error.message, modelSelect.value);
    }

    setStatus("Ready", false);
    fileInput.value = "";
}

/* ---------- New chat ---------- */
async function newChat() {
    threadId = crypto.randomUUID();
    safeSet(threadKey(), threadId);
    if (isDictating) stopDictation();
    if (isMobile()) closeSidebar();
    renderWelcome();
    await loadConversations();
    messageInput.focus();
}

/* ---------- Init ---------- */
async function bootstrapChat() {
    await loadConversations();
    if (threadId) await loadConversation(threadId);
    else renderWelcome();
}

renderUserChip();
hideLogin();
bootstrapChat();
